<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roulette</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#0a3d1f;font-family:Georgia,serif;user-select:none;overflow:hidden;}

#rotate-msg{display:none;position:fixed;inset:0;background:#0a3d1f;color:#f0d060;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:20px;text-align:center;z-index:999;padding:20px;}
@media(orientation:portrait){#rotate-msg{display:flex;}#game{display:none;}}

#game{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:row;gap:6px;padding:6px;overflow:hidden;}

#left-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;flex-shrink:0;min-width:0;}
#wheel-wrap{position:relative;}
#wc,#bc{display:block;border-radius:50%;}
#bc{position:absolute;top:0;left:0;pointer-events:none;}
#spin-btn{background:#f0d060;color:#1a0a00;border:none;border-radius:20px;font-family:Georgia,serif;font-weight:bold;font-size:14px;cursor:pointer;letter-spacing:1px;padding:10px 0;display:block;-webkit-appearance:none;flex-shrink:0;min-height:38px;z-index:5;}
#spin-btn:disabled{background:#555;color:#888;}

#right-col{flex:1;display:flex;flex-direction:column;gap:4px;overflow:hidden;min-width:0;}
#info-row{display:flex;gap:4px;flex-shrink:0;}
.sbox{background:rgba(0,0,0,0.5);border:1px solid #1a6635;border-radius:6px;padding:4px 6px;text-align:center;flex:1;min-width:0;}
.slabel{color:#7ab890;font-size:9px;letter-spacing:1px;text-transform:uppercase;}
.sval{color:#f0d060;font-size:13px;font-weight:bold;line-height:1.2;}
#result-box{background:rgba(0,0,0,0.5);border:1px solid #1a6635;border-radius:6px;padding:4px 8px;text-align:center;flex:2;min-width:0;}
#rnum{font-size:18px;font-weight:bold;color:#ccc;line-height:1.1;}
#rmsg{color:#ccc;font-size:9px;}
#chips-row{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.clabel{color:#7ab890;font-size:9px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;}
.chip{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,0.25);cursor:pointer;font-size:10px;font-weight:bold;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chip.sel{border-color:#f0d060;box-shadow:0 0 8px rgba(240,208,96,0.7);}
#clear-btn{background:rgba(180,40,40,0.85);border:1px solid #900;color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:11px;margin-left:auto;-webkit-appearance:none;}
#msg-bar{color:#f0d060;font-size:10px;text-align:center;flex-shrink:0;}
#board-container{flex:1;min-height:0;position:relative;}
#board-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation;}
</style>
</head>
<body>
<div id="rotate-msg">
  <div style="font-size:52px;">&#8635;</div>
  Rotate your phone to landscape
</div>
<div id="game">
  <div id="left-col">
    <div id="wheel-wrap">
      <canvas id="wc"></canvas>
      <canvas id="bc"></canvas>
    </div>
    <button id="spin-btn" type="button">SPIN</button>
  </div>
  <div id="right-col">
    <div id="info-row">
      <div class="sbox"><div class="slabel">Balance</div><div class="sval" id="bal">$1000</div></div>
      <div class="sbox"><div class="slabel">Bet</div><div class="sval" id="betval">$0</div></div>
      <div class="sbox"><div class="slabel">Last Win</div><div class="sval" id="winval">—</div></div>
      <div id="result-box"><div id="rnum">—</div><div id="rmsg">Place bets &amp; spin</div></div>
    </div>
    <div id="chips-row">
      <span class="clabel">Chip:</span>
      <div class="chip sel" data-v="1" style="background:#555;">$1</div>
      <div class="chip" data-v="5" style="background:#aa2222;">$5</div>
      <div class="chip" data-v="25" style="background:#1a44aa;">$25</div>
      <div class="chip" data-v="100" style="background:#1a7a22;">$100</div>
      <button id="clear-btn" type="button">Clear</button>
    </div>
    <div id="msg-bar">Tap a square to place a bet</div>
    <div id="board-container">
      <canvas id="board-canvas"></canvas>
    </div>
  </div>
</div>
<script>
const NUMS=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const numBg=n=>n===0?'#1a8a30':RED.has(n)?'#c0202a':'#111';

const wCv=document.getElementById('wc'),wCtx=wCv.getContext('2d');
const bCv=document.getElementById('bc'),bCtx=bCv.getContext('2d');
const boardCv=document.getElementById('board-canvas'),brdCtx=boardCv.getContext('2d');

let balance=1000,bets={},chip=1,spinning=false;
let wAngle=0,ballAngle=0,ballR=0,wSpeed=0,ballSpd=0,ballOn=false,layout=[];

function initSizes(){
  const W=window.innerWidth, H=window.innerHeight;
  const pad=6, gap=6;

  // Keep the left side small enough that the wheel + spin button always fit.
  const leftW=Math.max(115, Math.floor(W*0.28)-pad-gap/2);
  const btnH=42;
  const wheelSz=Math.max(100, Math.min(leftW, H-pad*2-btnH-gap-4));

  wCv.width=wCv.height=wheelSz;
  bCv.width=bCv.height=wheelSz;
  wCv.style.width=wCv.style.height=wheelSz+'px';
  bCv.style.width=bCv.style.height=wheelSz+'px';
  document.getElementById('wheel-wrap').style.cssText='position:relative;width:'+wheelSz+'px;height:'+wheelSz+'px;';

  const sb=document.getElementById('spin-btn');
  sb.style.width=wheelSz+'px';
  sb.style.display='block';

  document.getElementById('left-col').style.width=leftW+'px';

  // IMPORTANT FIX:
  // Size the board canvas from its real flexbox container, not from an estimate.
  // This prevents the lower red/black/odd/etc. row from being cut off.
  const rect=boardCv.getBoundingClientRect();
  boardCv.width=Math.max(1, Math.floor(rect.width));
  boardCv.height=Math.max(1, Math.floor(rect.height));
}

// ---- WHEEL ----
function drawWheel(a){
  const sz=wCv.width,cx=sz/2,cy=sz/2,r=sz/2-3;
  const ctx=wCtx,n=NUMS.length,sl=(Math.PI*2)/n;
  ctx.clearRect(0,0,sz,sz);
  ctx.save();ctx.translate(cx,cy);
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle='#c8a820';ctx.lineWidth=3;ctx.stroke();
  for(let i=0;i<n;i++){
    const ang=a+i*sl-sl/2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r-3,ang,ang+sl);ctx.closePath();
    ctx.fillStyle=numBg(NUMS[i]);ctx.fill();
    ctx.strokeStyle='#222';ctx.lineWidth=0.4;ctx.stroke();
    ctx.save();ctx.rotate(ang+sl/2);ctx.translate(r-14,0);ctx.rotate(Math.PI/2);
    ctx.fillStyle='#fff';ctx.font='bold '+Math.max(6,Math.floor(sz/30))+'px Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(NUMS[i],0,0);ctx.restore();
  }
  const hub=sz*0.1;
  ctx.beginPath();ctx.arc(0,0,hub,0,Math.PI*2);ctx.fillStyle='#3a3a3a';ctx.fill();
  ctx.strokeStyle='#c8a820';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,hub*0.3,0,Math.PI*2);ctx.fillStyle='#f0d060';ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(cx,cy);
  ctx.beginPath();ctx.arc(0,0,r+3,0,Math.PI*2);ctx.strokeStyle='#7a5010';ctx.lineWidth=5;ctx.stroke();
  ctx.restore();
}

function drawBall(a,br){
  const sz=wCv.width,cx=sz/2,cy=sz/2;
  bCtx.clearRect(0,0,sz,sz);
  if(!ballOn||br<=0)return;
  const x=cx+Math.cos(a)*br,y=cy+Math.sin(a)*br;
  bCtx.beginPath();bCtx.arc(x,y,Math.max(3,sz/40),0,Math.PI*2);
  bCtx.fillStyle='#eee';bCtx.fill();
  bCtx.strokeStyle='#888';bCtx.lineWidth=0.5;bCtx.stroke();
}

// ---- BOARD ----
// BUG FIX: each 2:1 cell gets a unique key using its row index ("col0","col1","col2")
function computeLayout(){
  layout=[];
  const W=boardCv.width,H=boardCv.height;

  const gridH=Math.floor(H*0.62);
  const outsideY=gridH+3;
  const outsideH=H-outsideY;

  const zw=Math.floor(W*0.07);
  const twoW=Math.floor(W*0.065);
  const numAreaW=W-zw-twoW-6;
  const colW=Math.floor(numAreaW/12);
  const rowH=Math.floor(gridH/3);
  const x0=zw+3,y0=0;

  function rng(a,b){const r=[];for(let i=a;i<=b;i++)r.push(i);return r;}

  layout.push({x:1,y:y0,w:zw-1,h:rowH*3,nums:[0],type:'straight',key:'straight|0',label:'0',display:'0'});

  for(let col=0;col<12;col++){
    for(let row=0;row<3;row++){
      const n=(2-row)+col*3+1;
      layout.push({x:x0+col*colW,y:y0+row*rowH,w:colW-1,h:rowH-1,nums:[n],type:'straight',key:'straight|'+n,label:String(n),display:String(n)});
    }
  }

  // FIX: each 2:1 row has a unique key AND a unique label for messages.
  // The board still visually displays "2:1" on all three.
  const tx=x0+12*colW+2;
  const colNames=['Top row','Middle row','Bottom row'];
  for(let i=0;i<3;i++){
    const rowNums=[...Array(12)].map((_,c)=>(2-i)+c*3+1);
    layout.push({
      x:tx,y:y0+i*rowH,w:twoW,h:rowH-1,
      nums:rowNums,type:'col',key:'col|'+i,
      label:'2:1 '+colNames[i],
      display:'2:1'
    });
  }

  // FIX: split outside bets into two rows so red/black/odd/etc. are fully visible.
  const dozenH=Math.max(18, Math.floor(outsideH*0.46));
  const lowerY=outsideY+dozenH+2;
  const lowerH=Math.max(18, H-lowerY);

  const dozens=[
    {l:'1-12', ns:rng(1,12)},
    {l:'13-24',ns:rng(13,24)},
    {l:'25-36',ns:rng(25,36)}
  ];

  const dozenW=Math.floor((W-4)/3);
  dozens.forEach((b,i)=>{
    layout.push({
      x:1+i*dozenW,y:outsideY,w:dozenW-2,h:dozenH,
      nums:b.ns,type:'dozen',key:'dozen|'+b.l,label:b.l,display:b.l
    });
  });

  const lower=[
    {l:'1-18', ns:rng(1,18)},
    {l:'Even', ns:rng(2,36).filter(n=>n%2===0)},
    {l:'Red',  ns:[...RED]},
    {l:'Black',ns:rng(1,36).filter(n=>!RED.has(n))},
    {l:'Odd',  ns:rng(1,35).filter(n=>n%2===1)},
    {l:'19-36',ns:rng(19,36)}
  ];

  const lowerW=Math.floor((W-2)/lower.length);
  lower.forEach((b,i)=>{
    layout.push({
      x:1+i*lowerW,y:lowerY,w:lowerW-2,h:lowerH,
      nums:b.ns,type:'even',key:'even|'+b.l,label:b.l,display:b.l
    });
  });
}

function drawBoard(){
  computeLayout();
  const ctx=brdCtx,W=boardCv.width,H=boardCv.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0d5c2a';ctx.fillRect(0,0,W,H);
  for(const c of layout){
    let bg='#0a4a20';
    if(c.type==='straight')bg=numBg(c.nums[0]);
    else if(c.label==='Red')bg='#8a1515';
    else if(c.label==='Black')bg='#111';
    ctx.fillStyle=bg;
    ctx.beginPath();ctx.roundRect(c.x,c.y,c.w,c.h,2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=0.5;ctx.stroke();
    ctx.fillStyle='#fff';
    const fs=Math.max(7,Math.min(c.w,c.h)*0.38);
    ctx.font='bold '+fs+'px Georgia';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.display||c.label,c.x+c.w/2,c.y+c.h/2);
  }
}

function redrawBets(){
  drawBoard();
  Object.entries(bets).forEach(([k,amt])=>{
    if(!amt)return;
    const cell=layout.find(l=>l.key===k);
    if(!cell)return;
    const cx=cell.x+cell.w/2,cy=cell.y+cell.h/2;
    const r=Math.max(6,Math.min(cell.w,cell.h)*0.3);
    brdCtx.beginPath();brdCtx.arc(cx,cy,r,0,Math.PI*2);
    brdCtx.fillStyle=amt>=100?'#1a7a22':amt>=25?'#1a44aa':amt>=5?'#aa2222':'#555';
    brdCtx.fill();
    brdCtx.strokeStyle='#f0d060';brdCtx.lineWidth=1.5;brdCtx.stroke();
    brdCtx.fillStyle='#fff';
    brdCtx.font='bold '+Math.max(7,r*0.65)+'px Arial';
    brdCtx.textAlign='center';brdCtx.textBaseline='middle';
    brdCtx.fillText('$'+amt,cx,cy);
  });
}

function totalBet(){return Object.values(bets).reduce((a,b)=>a+b,0);}
function updateUI(){
  document.getElementById('bal').textContent='$'+balance;
  document.getElementById('betval').textContent='$'+totalBet();
}
function setMsg(t){document.getElementById('msg-bar').textContent=t;}

// HIT TEST — board canvas.width === declared pixel width, so coords are 1:1 with canvas pixels
function handleBoardTap(clientX,clientY){
  if(spinning)return;
  const rect=boardCv.getBoundingClientRect();
  // Scale: canvas logical px / displayed px
  const scaleX=boardCv.width/rect.width;
  const scaleY=boardCv.height/rect.height;
  const x=(clientX-rect.left)*scaleX;
  const y=(clientY-rect.top)*scaleY;
  for(const c of layout){
    if(x>=c.x&&x<c.x+c.w&&y>=c.y&&y<c.y+c.h){
      if(totalBet()+chip>balance){setMsg('Not enough balance!');return;}
      bets[c.key]=(bets[c.key]||0)+chip;
      redrawBets();updateUI();
      setMsg('$'+bets[c.key]+' on '+c.label);
      return;
    }
  }
}

boardCv.addEventListener('click',e=>handleBoardTap(e.clientX,e.clientY));
boardCv.addEventListener('touchend',e=>{
  e.preventDefault();
  handleBoardTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
},{passive:false});

document.querySelectorAll('.chip').forEach(ch=>{
  function sel(){
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
    ch.classList.add('sel');chip=parseInt(ch.dataset.v);
    setMsg('Chip $'+chip+' selected');
  }
  ch.addEventListener('click',sel);
  ch.addEventListener('touchend',e=>{e.preventDefault();sel();},{passive:false});
});

document.getElementById('clear-btn').addEventListener('click',()=>{if(!spinning){bets={};redrawBets();updateUI();setMsg('Bets cleared');}});
document.getElementById('clear-btn').addEventListener('touchend',e=>{e.preventDefault();if(!spinning){bets={};redrawBets();updateUI();setMsg('Bets cleared');}},{passive:false});

function triggerSpin(){
  if(spinning)return;
  const tb=totalBet();
  if(tb===0){setMsg('Place at least one bet first!');return;}
  balance-=tb;updateUI();doSpin(tb);
}
document.getElementById('spin-btn').addEventListener('click',triggerSpin);
document.getElementById('spin-btn').addEventListener('touchend',e=>{e.preventDefault();triggerSpin();},{passive:false});

function doSpin(staked){
  spinning=true;ballOn=true;
  document.getElementById('spin-btn').disabled=true;
  const winIdx=Math.floor(Math.random()*NUMS.length);
  const winNum=NUMS[winIdx];
  const sl=(Math.PI*2)/NUMS.length;
  const sz=wCv.width;
  const outerR=(sz/2-4)*0.87;
  const innerR=(sz/2-4)*0.70;
  wSpeed=0.09;ballSpd=-0.17;ballR=outerR;ballAngle=0;
  let tick=0,settled=false;
  function frame(){
    tick++;wAngle+=wSpeed;
    if(tick>120){wSpeed*=0.994;ballSpd*=0.989;ballR=Math.max(innerR,ballR-(outerR-innerR)/200);}
    if(tick>120&&Math.abs(ballSpd)<0.005&&!settled){
      settled=true;ballSpd=0;
      ballAngle=wAngle+winIdx*sl+sl/2;
      ballR=innerR;
      drawWheel(wAngle);drawBall(ballAngle,ballR);
      setTimeout(()=>finish(winNum,staked),700);
      return;
    }
    if(!settled)ballAngle+=ballSpd;
    drawWheel(wAngle);drawBall(ballAngle,ballR);
    if(!settled||wSpeed>0.001)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function finish(num,staked){
  spinning=false;
  document.getElementById('spin-btn').disabled=false;
  let winnings=0;
  Object.entries(bets).forEach(([k,amt])=>{
    const cell=layout.find(l=>l.key===k);
    if(!cell||!cell.nums.includes(num))return;
    const pay=cell.type==='straight'?35:cell.type==='col'||cell.type==='dozen'?2:1;
    winnings+=amt*(pay+1);
  });
  balance+=winnings;updateUI();
  const isRed=RED.has(num),isGreen=num===0;
  document.getElementById('rnum').style.color=isGreen?'#2ecc71':isRed?'#e74c3c':'#bbb';
  document.getElementById('rnum').textContent=num;
  const col=isGreen?'Green':isRed?'Red':'Black';
  if(winnings>0){
    document.getElementById('winval').textContent='+'+'$'+(winnings-staked);
    document.getElementById('winval').style.color='#2ecc71';
    document.getElementById('rmsg').textContent='Won $'+winnings+'! ('+col+' '+num+')';
    setMsg('You won $'+winnings+'!');
  }else{
    document.getElementById('winval').textContent='-$'+staked;
    document.getElementById('winval').style.color='#e74c3c';
    document.getElementById('rmsg').textContent=col+' '+num+' — no win';
    setMsg('No win. Try again!');
  }
  bets={};redrawBets();
  if(balance<=0)setMsg('Out of chips! Refresh to restart.');
}

function init(){
  initSizes();
  // If the browser has not finished flex layout yet, retry once on the next frame.
  if(boardCv.width<=1 || boardCv.height<=1){
    requestAnimationFrame(init);
    return;
  }
  drawWheel(0);
  redrawBets();
  updateUI();
}

init();
window.addEventListener('resize',init);
if(screen.orientation)screen.orientation.addEventListener('change',()=>setTimeout(init,200));
</script>
</body>
</html>
